<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>얼굴낙서!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Pretendard, Apple SD Gothic Neo, Arial, sans-serif;
      background: #f8f6ff;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-image: url("./images/background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .stage {
      position: relative;
  width: min(1400px, 96vw);
  min-height: min(900px, 92vh);
      padding: 54px 56px 44px;
      border-radius: 36px;
      background: linear-gradient(180deg, rgba(255,255,255,0.42), rgba(255,255,255,0.22));
      border: 2px solid rgba(255,255,255,0.7);
      box-shadow: 0 30px 80px rgba(82, 62, 120, 0.25);
      backdrop-filter: blur(4px);
      overflow: hidden;
    }

    .stage::before,
    .stage::after {
      content: "";
      position: absolute;
      pointer-events: none;
      opacity: 0.85;
    }

    .stage::before {
      inset: 0;
      background-image:
        radial-gradient(circle at 8% 18%, rgba(255,255,255,0.9) 0 2px, transparent 3px),
        radial-gradient(circle at 22% 9%, rgba(255,255,255,0.85) 0 2px, transparent 3px),
        radial-gradient(circle at 85% 20%, rgba(255,255,255,0.9) 0 2px, transparent 3px),
        radial-gradient(circle at 77% 68%, rgba(255,255,255,0.85) 0 2px, transparent 3px);
    }

    .stage::after {
      right: 52px;
      top: 48px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      box-shadow: -22px 12px 0 0 rgba(255,255,255,0.86);
      transform: rotate(-18deg);
    }

    .title-wrap {
      position: relative;
      z-index: 2;
      text-align: center;
      color: #fff;
      text-shadow: 0 4px 18px rgba(74, 56, 128, 0.45);
      margin-bottom: 44px;
    }

    .title {
      font-size: clamp(32px, 4vw, 58px);
      font-weight: 950;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin-top: 8px;
      font-size: clamp(15px, 1.7vw, 22px);
      font-weight: 700;
      opacity: 0.95;
    }

    .players {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(2, minmax(260px, 1fr));
      gap: clamp(36px, 7vw, 90px);
      align-items: start;
      max-width: 860px;
      margin: 0 auto;
    }

    .player {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .label {
      font-size: clamp(26px, 3vw, 42px);
      font-weight: 950;
      color: #fff;
      text-shadow:
        -3px -3px 0 rgba(110, 85, 255, 0.9),
        3px 3px 0 rgba(52, 161, 255, 0.75),
        0 7px 18px rgba(0,0,0,0.18);
    }

    .polaroid {
      position: relative;
      width: min(430px, 76vw);
      aspect-ratio: 0.78;
      padding: 14px 14px 52px;
      background: #fff;
      box-shadow:
        0 18px 42px rgba(57, 44, 92, 0.28),
        inset 0 0 0 1px rgba(0,0,0,0.04);
      transform: rotate(-1.5deg);
    }

    .player:nth-child(2) .polaroid {
      transform: rotate(1.5deg);
    }

    .portrait-box {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f2f2f2;
    }

    .portrait {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    .doodle {
      position: absolute;
      width: 26%;
      height: auto;
      transform-origin: center;
      user-select: none;
      pointer-events: none;
      animation: pop 0.18s ease-out;
      filter: drop-shadow(0 3px 2px rgba(0,0,0,0.12));
      z-index: 3;
    }
    
.sticker-palette {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  max-width: 420px;
}

.sticker-palette img {
  width: 54px;
  height: 54px;
  object-fit: contain;
  cursor: pointer;
  padding: 6px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.85);
  box-shadow: 0 5px 12px rgba(0,0,0,0.15);
}

.sticker-palette img.selected {
  outline: 4px solid #ff4fa3;
}
    @keyframes pop {
      0% {
        transform: scale(0.2) rotate(var(--rotate));
        opacity: 0;
      }
      70% {
        transform: scale(1.18) rotate(var(--rotate));
        opacity: 1;
      }
      100% {
        transform: scale(1) rotate(var(--rotate));
        opacity: 1;
      }
    }


    .reset-area {
      position: relative;
      z-index: 2;
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .reset-button {
      cursor: pointer;
      border: 0;
      border-radius: 14px;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: 900;
      color: #fff;
      background: rgba(42, 42, 48, 0.78);
      box-shadow: 0 10px 18px rgba(0,0,0,0.18);
      backdrop-filter: blur(8px);
    }

    .deco {
      position: absolute;
      z-index: 1;
      color: rgba(255,255,255,0.85);
      font-weight: 900;
      text-shadow: 0 4px 12px rgba(64, 50, 120, 0.22);
      pointer-events: none;
    }

    .deco.star1 { left: 70px; top: 80px; font-size: 48px; }
    .deco.star2 { right: 120px; bottom: 180px; font-size: 64px; }
    .deco.cloud1 { left: 50px; bottom: 70px; font-size: 74px; opacity: 0.55; }
    .deco.flower1 { right: 70px; top: 300px; font-size: 58px; opacity: 0.75; }

    @media (max-width: 820px) {
      body {
        overflow-y: auto;
      }

      .page {
        min-height: 100vh;
        height: auto;
        padding: 20px;
      }

      .stage {
        min-height: auto;
        padding: 34px 18px 28px;
      }

      .players {
        grid-template-columns: 1fr;
        gap: 36px;
      }

      .polaroid {
        width: min(430px, 76vw);
      }

      .reset-area {
        margin-bottom: 10px;
      }

      .deco {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="stage">
<div class="deco star1">🐰</div>
<div class="deco star2">🧜‍♀️</div>
<div class="deco cloud1">🐇</div>
<div class="deco flower1">🪸</div>

      <div class="title-wrap">
        <h1 class="title">✧랜덤 낙서 드가자✧</h1>
        <p class="subtitle">대답 못할때마다 못생겨지기!</p>
      </div>

      <div class="players">
        <section class="player">
          <div class="label">금독희♥</div>
          <div class="polaroid">
            <div class="portrait-box" id="portraitA" onclick="placeSticker(event, 'portraitA')">
              <img class="portrait" src="./images/portrait-a.png" alt="A 초상화" />
            </div>
          </div>
       <div class="sticker-palette">
  <img src="./images/doodle-01.png" onclick="selectSticker(event, './images/doodle-01.png')">
  <img src="./images/doodle-02.png" onclick="selectSticker(event, './images/doodle-02.png')">
  <img src="./images/doodle-03.png" onclick="selectSticker(event, './images/doodle-03.png')">
  <img src="./images/doodle-04.png" onclick="selectSticker(event, './images/doodle-04.png')">
  <img src="./images/doodle-05.png" onclick="selectSticker(event, './images/doodle-05.png')">
  <img src="./images/doodle-06.png" onclick="selectSticker(event, './images/doodle-06.png')">
  <img src="./images/doodle-07.png" onclick="selectSticker(event, './images/doodle-07.png')">
  <img src="./images/doodle-08.png" onclick="selectSticker(event, './images/doodle-08.png')">
  <img src="./images/doodle-09.png" onclick="selectSticker(event, './images/doodle-09.png')">
  <img src="./images/doodle-10.png" onclick="selectSticker(event, './images/doodle-10.png')">
</div>
         
        </section>

        <section class="player">
          <div class="label">해레느♥</div>
          <div class="polaroid">
            <div class="portrait-box" id="portraitB" onclick="placeSticker(event, 'portraitB')">
              <img class="portrait" src="./images/portrait-b.png" alt="B 초상화" />
            </div>
          </div>
<div class="sticker-palette">
  <img src="./images/doodle-01.png" onclick="selectSticker(event, './images/doodle-01.png')">
  <img src="./images/doodle-02.png" onclick="selectSticker(event, './images/doodle-02.png')">
  <img src="./images/doodle-03.png" onclick="selectSticker(event, './images/doodle-03.png')">
  <img src="./images/doodle-04.png" onclick="selectSticker(event, './images/doodle-04.png')">
  <img src="./images/doodle-05.png" onclick="selectSticker(event, './images/doodle-05.png')">
  <img src="./images/doodle-06.png" onclick="selectSticker(event, './images/doodle-06.png')">
  <img src="./images/doodle-07.png" onclick="selectSticker(event, './images/doodle-07.png')">
  <img src="./images/doodle-08.png" onclick="selectSticker(event, './images/doodle-08.png')">
  <img src="./images/doodle-09.png" onclick="selectSticker(event, './images/doodle-09.png')">
  <img src="./images/doodle-10.png" onclick="selectSticker(event, './images/doodle-10.png')">
</div>
        </section>
      </div>

      <div class="reset-area">
        <button class="reset-button" onclick="clearDoodles('portraitA')">독희 초기화</button>
        <button class="reset-button" onclick="clearDoodles('portraitB')">레느 초기화</button>
        <button class="reset-button" onclick="clearAllDoodles()">↻ 모든 낙서 초기화</button>
      </div>
    </section>
  </main>

  <script>
    const doodleImages = [
      "./images/doodle-01.png",
      "./images/doodle-02.png",
      "./images/doodle-03.png",
      "./images/doodle-04.png",
      "./images/doodle-05.png",
      "./images/doodle-06.png",
      "./images/doodle-07.png",
      "./images/doodle-08.png",
      "./images/doodle-09.png",
      "./images/doodle-10.png"
    ];

    function getRandomItem(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

let selectedSticker = null;

function selectSticker(event, stickerSrc) {
  selectedSticker = stickerSrc;

  document.querySelectorAll(".sticker-palette img").forEach(img => {
    img.classList.remove("selected");
  });

  event.target.classList.add("selected");
}

function placeSticker(event, targetId) {
  if (!selectedSticker) {
    alert("먼저 붙일 낙서를 선택해주세요!");
    return;
  }

  const target = document.getElementById(targetId);
  const rect = target.getBoundingClientRect();

  const x = ((event.clientX - rect.left) / rect.width) * 100;
  const y = ((event.clientY - rect.top) / rect.height) * 100;

  const sticker = document.createElement("img");
  sticker.src = selectedSticker;
  sticker.className = "doodle";

  sticker.style.left = `${x - 12}%`;
  sticker.style.top = `${y - 12}%`;
  sticker.style.width = "24%";
  sticker.style.transform = `rotate(${randomBetween(-18, 18)}deg)`;

  target.appendChild(sticker);
}
 
    function clearDoodles(targetId) {
      const target = document.getElementById(targetId);
      target.querySelectorAll(".doodle").forEach((doodle) => doodle.remove());
    }

    function clearAllDoodles() {
      clearDoodles("portraitA");
      clearDoodles("portraitB");
    }
    
  </script>
</body>
</html>
